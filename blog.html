<style>
.blog-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 20px;
}

.blog-card {
  border: 1px solid #ddd;
  padding: 12px;
  border-radius: 10px;
  background: #fff;
}

.blog-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}
</style>

<div class="blog-grid">
  <div class="blog-card">
    <img src="https://via.placeholder.com/400" />
    <p>Card 1</p>
  </div>

  <div class="blog-card">
    <img src="https://via.placeholder.com/400" />
    <p>Card 2</p>
  </div>

  <div class="blog-card">
    <img src="https://via.placeholder.com/400" />
    <p>Card 3</p>
  </div>

  <div class="blog-card">
    <img src="https://via.placeholder.com/400" />
    <p>Card 4</p>
  </div>
</div>
<div id="blog-container" class="blog-grid"></div>

<script>
fetch('./blog.json?v=20')
  .then(res => res.json())
  .then(blogs => {
    const container = document.getElementById('blog-container');

    blogs.reverse().slice(0, 3).forEach(blog => {
      const div = document.createElement('div');
div.classList.add('blog-card');

      div.innerHTML = `
        <h2>${blog.title}</h2>
        <img src="${blog.image}" style="width:100%; max-width:600px;" />
        <p><b>${blog.date}</b></p>
        <p>${blog.body.replace(/<[^>]+>/g, '').substring(0, 150)}...</p>

        <a href="blog-detail.html?id=${blog.id}" 
           style="display:inline-block; margin:10px 0; padding:8px 16px; background:black; color:white; text-decoration:none;">
           Read More →
        </a>

        <hr/>
      `;

      container.appendChild(div);
    });
  });
</script>
