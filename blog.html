<div id="blog-container"></div>

<script>
fetch('./blog.json?v=5')  // cache fix
  .then(res => {
    if (!res.ok) throw new Error("JSON not loading");
    return res.text();
  })
  .then(text => {
    console.log("RAW:", text);

    const blogs = JSON.parse(text);

    const container = document.getElementById('blog-container');

    blogs.forEach(blog => {
      const div = document.createElement('div');

      div.innerHTML = `
        <h2>${blog.title}</h2>
        <img src="${blog.image}" style="width:100%; max-width:600px;"/>
        <p><b>${blog.date}</b></p>
        <div>${blog.body}</div>
        <hr/>
      `;

      container.appendChild(div);
    });
  })
  .catch(err => {
    console.error("ERROR:", err);
    document.getElementById('blog-container').innerHTML =
      "<p>Still not loading. Check console.</p>";
  });
</script>
